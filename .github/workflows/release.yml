name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=godeploy-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          # @Ref: docs/sps/plans/20260721_github_actions.md | @Date: 2026-07-21
          go build -o $BINARY_NAME ./cmd/pdeploy
          
          # Compress binary (tar.gz for linux/darwin, zip for windows)
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip ${BINARY_NAME}.zip $BINARY_NAME
            echo "ASSET_NAME=${BINARY_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czvf ${BINARY_NAME}.tar.gz $BINARY_NAME
            echo "ASSET_NAME=${BINARY_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET_NAME }}
